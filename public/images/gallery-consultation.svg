<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration of a calm homeopathic consultation room with a desk, chairs, plants and an arched window">
  <defs>
    <linearGradient id="cr-wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5EEDF"/>
      <stop offset="1" stop-color="#EFE6D3"/>
    </linearGradient>
    <linearGradient id="cr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DDEBE0"/>
      <stop offset="1" stop-color="#C3D6C5"/>
    </linearGradient>
    <linearGradient id="cr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E5D8BE"/>
      <stop offset="1" stop-color="#D8C7A6"/>
    </linearGradient>
    <linearGradient id="cr-desk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A9743F"/>
      <stop offset="1" stop-color="#7C5028"/>
    </linearGradient>
    <linearGradient id="cr-chair" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C9D8C4"/>
      <stop offset="1" stop-color="#AFC4AC"/>
    </linearGradient>
    <radialGradient id="cr-shadow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#5B4A2C" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5B4A2C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#cr-wall)"/>
  <rect y="782" width="800" height="218" fill="url(#cr-floor)"/>
  <rect y="778" width="800" height="6" fill="#F2E8D4"/>

  <!-- arch window -->
  <path d="M120 640V300c0-108 92-180 200-180s200 72 200 180v340Z" fill="#F8F3E7" stroke="#D8CCB4" stroke-width="4"/>
  <path d="M144 620V306c0-94 78-158 176-158s176 64 176 158v314Z" fill="url(#cr-sky)"/>
  <path d="M320 148v472M144 420h352" stroke="#F8F3E7" stroke-width="8"/>
  <path d="M320 148v472M144 420h352" stroke="#CBD9C8" stroke-width="1.4"/>
  <!-- view: soft foliage -->
  <g fill="#8FA98F" opacity=".85">
    <circle cx="206" cy="332" r="46"/>
    <circle cx="252" cy="300" r="34"/>
    <circle cx="262" cy="372" r="28"/>
    <circle cx="400" cy="300" r="42"/>
    <circle cx="432" cy="352" r="34"/>
    <circle cx="376" cy="360" r="24"/>
    <circle cx="186" cy="536" r="38"/>
    <circle cx="426" cy="532" r="44"/>
  </g>
  <g fill="#6F8F72" opacity=".75">
    <circle cx="230" cy="392" r="22"/>
    <circle cx="392" cy="394" r="20"/>
    <circle cx="240" cy="548" r="26"/>
    <circle cx="396" cy="560" r="28"/>
  </g>
  <path d="M144 600h352v20H144Z" fill="#EFE4CF"/>

  <!-- framed botanical art -->
  <g transform="translate(580 246)">
    <rect width="142" height="182" rx="6" fill="#F9F4E8" stroke="#C9BCA1" stroke-width="3"/>
    <rect x="10" y="10" width="122" height="162" rx="3" fill="#E7EDE1"/>
    <path d="M71 150V56" stroke="#6F8F72" stroke-width="2"/>
    <path d="M71 108c-24 0-36-12-37-35 24-1 36 12 37 35Z" fill="#8FA98F"/>
    <path d="M71 88c1-23 13-35 37-34-1 23-13 34-37 34Z" fill="#A9BEA6"/>
    <path d="M71 62c-13 0-20-7-21-20 14 0 20 7 21 20Z" fill="#7E9A82"/>
  </g>

  <!-- tall plant right -->
  <g>
    <ellipse cx="716" cy="742" rx="58" ry="12" fill="url(#cr-shadow)"/>
    <path d="M686 648h62l12 94h-86Z" fill="#B98A5D"/>
    <path d="M686 648h62l-6-14h-50Z" fill="#D2A574"/>
    <g stroke="#5F7F63" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M716 648c-2-90-6-150-24-206"/>
      <path d="M716 620c14-54 30-92 54-124"/>
      <path d="M714 584c-24-38-42-62-70-78"/>
    </g>
    <g fill="#7E9A82">
      <ellipse cx="690" cy="470" rx="44" ry="20" transform="rotate(-34 690 470)"/>
      <ellipse cx="748" cy="516" rx="40" ry="18" transform="rotate(30 748 516)"/>
      <ellipse cx="656" cy="532" rx="34" ry="16" transform="rotate(22 656 532)"/>
      <ellipse cx="734" cy="586" rx="32" ry="15" transform="rotate(-28 734 586)"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="710" cy="424" rx="30" ry="14" transform="rotate(-16 710 424)"/>
      <ellipse cx="700" cy="548" rx="26" ry="12" transform="rotate(36 700 548)"/>
    </g>
  </g>

  <!-- desk -->
  <g>
    <ellipse cx="400" cy="846" rx="280" ry="28" fill="url(#cr-shadow)"/>
    <rect x="164" y="716" width="472" height="26" rx="11" fill="url(#cr-desk)"/>
    <rect x="164" y="716" width="472" height="8" rx="4" fill="#C08C55"/>
    <rect x="196" y="742" width="18" height="108" rx="6" fill="#6E4523"/>
    <rect x="586" y="742" width="18" height="108" rx="6" fill="#6E4523"/>
    <rect x="196" y="742" width="6" height="108" fill="#946138" opacity=".5"/>
    <rect x="586" y="742" width="6" height="108" fill="#946138" opacity=".5"/>
  </g>

  <!-- desk items: lamp, papers, bottles -->
  <g>
    <rect x="470" y="668" width="70" height="48" rx="5" fill="#F8F3E7"/>
    <rect x="480" y="678" width="42" height="3" rx="1.5" fill="#A9BEA6"/>
    <rect x="480" y="687" width="50" height="3" rx="1.5" fill="#D3C8B1"/>
    <rect x="480" y="696" width="36" height="3" rx="1.5" fill="#D3C8B1"/>
    <rect x="452" y="692" width="56" height="24" rx="4" fill="#EFE6D3" stroke="#D8CCB4"/>
    <g>
      <path d="M214 704h44l-8 12h-28Z" fill="#E9DFC9"/>
      <rect x="230" y="636" width="10" height="70" rx="5" fill="#6E4523"/>
      <path d="M200 636h70l-10-40h-50Z" fill="#F4E9CE" stroke="#D3BE96" stroke-width="2"/>
      <ellipse cx="235" cy="636" rx="35" ry="7" fill="#FFF8E6"/>
    </g>
    <g>
      <rect x="566" y="678" width="34" height="38" rx="7" fill="#B07A45"/>
      <rect x="574" y="666" width="18" height="16" rx="4" fill="#3E2C1A"/>
      <rect x="572" y="686" width="22" height="16" rx="2" fill="#F5EEDD" opacity=".85"/>
      <rect x="548" y="688" width="26" height="28" rx="5" fill="#DDE8DA"/>
      <rect x="554" y="680" width="14" height="10" rx="3" fill="#8FA98F"/>
    </g>
  </g>

  <!-- two chairs -->
  <g>
    <ellipse cx="300" cy="912" rx="96" ry="18" fill="url(#cr-shadow)"/>
    <path d="M232 900v-96c0-24 18-42 42-42h58c24 0 42 18 42 42v96Z" fill="url(#cr-chair)"/>
    <rect x="246" y="826" width="114" height="44" rx="18" fill="#E9EFE4"/>
    <rect x="242" y="846" width="12" height="78" rx="5" fill="#8C6A3E"/>
    <rect x="354" y="846" width="12" height="78" rx="5" fill="#8C6A3E"/>
    <rect x="252" y="768" width="86" height="18" rx="9" fill="#E9EFE4"/>
  </g>
  <g>
    <ellipse cx="536" cy="928" rx="86" ry="16" fill="url(#cr-shadow)"/>
    <path d="M478 918v-84c0-22 16-38 38-38h46c22 0 38 16 38 38v84Z" fill="#D9C6A6"/>
    <rect x="492" y="852" width="100" height="40" rx="16" fill="#EADCC2"/>
    <rect x="490" y="872" width="11" height="70" rx="5" fill="#8C6A3E"/>
    <rect x="590" y="872" width="11" height="70" rx="5" fill="#8C6A3E"/>
  </g>

  <!-- rug -->
  <ellipse cx="410" cy="948" rx="290" ry="46" fill="#DCE6D6" opacity=".72"/>
  <ellipse cx="410" cy="948" rx="240" ry="35" fill="none" stroke="#C6D5C1" stroke-width="2"/>

  <!-- small wall detail -->
  <g fill="#C2A265" opacity=".75">
    <circle cx="82" cy="260" r="4"/>
    <circle cx="82" cy="292" r="4"/>
    <circle cx="82" cy="324" r="4"/>
  </g>
</svg>
