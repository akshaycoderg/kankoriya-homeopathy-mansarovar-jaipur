<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration of an apothecary shelf with amber remedy bottles, glass jars, dried herbs and a mortar">
  <defs>
    <linearGradient id="rs-wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E9EEDF"/>
      <stop offset="1" stop-color="#DFE8D8"/>
    </linearGradient>
    <linearGradient id="rs-niche" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D7E3D2"/>
      <stop offset="1" stop-color="#C6D6C3"/>
    </linearGradient>
    <linearGradient id="rs-wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#B9834C"/>
      <stop offset="1" stop-color="#8A5A30"/>
    </linearGradient>
    <linearGradient id="rs-amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CE9648"/>
      <stop offset="1" stop-color="#955F22"/>
    </linearGradient>
    <linearGradient id="rs-glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#DCE7DA" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="rs-shadow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#4E4028" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4E4028" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#rs-wall)"/>

  <!-- cabinet niche -->
  <path d="M86 830V336c0-124 141-206 314-206s314 82 314 206v494Z" fill="url(#rs-niche)"/>
  <path d="M86 830V336c0-124 141-206 314-206s314 82 314 206v494Z" fill="none" stroke="#AFC5AD" stroke-width="10"/>
  <path d="M104 830V340c0-110 132-190 296-190s296 80 296 190v490Z" fill="#E4ECDF" opacity=".55"/>

  <!-- shelves -->
  <g>
    <rect x="120" y="398" width="560" height="18" rx="5" fill="url(#rs-wood)"/>
    <rect x="120" y="398" width="560" height="5" fill="#D3A16A"/>
    <rect x="120" y="596" width="560" height="18" rx="5" fill="url(#rs-wood)"/>
    <rect x="120" y="596" width="560" height="5" fill="#D3A16A"/>
    <rect x="150" y="416" width="8" height="180" fill="#8A5A30" opacity=".25"/>
    <rect x="642" y="416" width="8" height="180" fill="#8A5A30" opacity=".25"/>
  </g>

  <!-- top row bottles -->
  <g>
    <!-- tall amber -->
    <rect x="160" y="300" width="54" height="96" rx="10" fill="url(#rs-amber)"/>
    <rect x="172" y="278" width="30" height="26" rx="5" fill="#3E2C1A"/>
    <rect x="166" y="318" width="42" height="42" rx="3" fill="#F7F0DE" opacity=".9"/>
    <rect x="172" y="330" width="28" height="3" fill="#6F8F72"/>
    <rect x="172" y="338" width="20" height="2.5" fill="#B7AE99"/>
    <rect x="172" y="345" width="24" height="2.5" fill="#B7AE99"/>
    <!-- clear jar -->
    <rect x="238" y="330" width="62" height="66" rx="9" fill="url(#rs-glass)" stroke="#BECDBB" stroke-width="2"/>
    <rect x="244" y="352" width="50" height="38" rx="5" fill="#A7B98D" opacity=".8"/>
    <rect x="242" y="312" width="54" height="22" rx="5" fill="#B98A5D"/>
    <!-- small round bottles -->
    <g>
      <rect x="326" y="332" width="46" height="64" rx="10" fill="#E7EDE1" stroke="#C8D6C5" stroke-width="2"/>
      <rect x="338" y="316" width="22" height="18" rx="4" fill="#5B422A"/>
      <rect x="332" y="352" width="34" height="24" rx="2" fill="#F9F4E8"/>
      <rect x="338" y="360" width="22" height="2.5" fill="#7E9A82"/>
      <rect x="338" y="367" width="16" height="2.5" fill="#C9BFA9"/>
    </g>
    <g>
      <rect x="392" y="310" width="44" height="86" rx="10" fill="url(#rs-amber)"/>
      <rect x="404" y="288" width="20" height="24" rx="5" fill="#3E2C1A"/>
      <rect x="398" y="336" width="32" height="34" rx="3" fill="#F9F4E8" opacity=".92"/>
      <rect x="404" y="346" width="20" height="2.5" fill="#6F8F72"/>
      <rect x="404" y="353" width="15" height="2.5" fill="#C9BFA9"/>
    </g>
    <!-- big glass jar with herbs -->
    <g>
      <rect x="460" y="282" width="82" height="114" rx="12" fill="url(#rs-glass)" stroke="#BECDBB" stroke-width="2"/>
      <rect x="468" y="330" width="66" height="56" rx="7" fill="#9DB58C" opacity=".85"/>
      <g fill="#6F8F72">
        <ellipse cx="486" cy="346" rx="15" ry="7" transform="rotate(-24 486 346)"/>
        <ellipse cx="512" cy="358" rx="14" ry="6" transform="rotate(20 512 358)"/>
        <ellipse cx="494" cy="370" rx="12" ry="5" transform="rotate(-10 494 370)"/>
      </g>
      <rect x="468" y="264" width="66" height="24" rx="6" fill="#B98A5D"/>
      <rect x="478" y="272" width="46" height="8" rx="3" fill="#E9D7B7" opacity=".8"/>
    </g>
    <!-- dropper bottles -->
    <g>
      <rect x="566" y="316" width="42" height="82" rx="9" fill="#DDE8DA"/>
      <rect x="578" y="298" width="18" height="20" rx="4" fill="#3E2C1A"/>
      <rect x="572" y="344" width="30" height="30" rx="2" fill="#F9F4E8"/>
      <rect x="578" y="354" width="18" height="2.5" fill="#7E9A82"/>
      <rect x="578" y="361" width="13" height="2.5" fill="#C9BFA9"/>
    </g>
    <g>
      <rect x="620" y="336" width="40" height="62" rx="8" fill="url(#rs-amber)"/>
      <rect x="632" y="320" width="16" height="18" rx="4" fill="#241A10"/>
      <rect x="626" y="356" width="28" height="22" rx="2" fill="#F9F4E8" opacity=".9"/>
    </g>
  </g>

  <!-- middle row -->
  <g>
    <!-- wide amber jar -->
    <rect x="150" y="508" width="96" height="88" rx="14" fill="url(#rs-amber)"/>
    <rect x="164" y="486" width="68" height="26" rx="6" fill="#3E2C1A"/>
    <rect x="160" y="536" width="76" height="36" rx="3" fill="#F7F0DE" opacity=".92"/>
    <rect x="170" y="546" width="54" height="3" fill="#6F8F72"/>
    <rect x="170" y="555" width="40" height="2.5" fill="#C9BFA9"/>
    <!-- stack of tins -->
    <g>
      <rect x="274" y="544" width="74" height="24" rx="7" fill="#C2A265"/>
      <rect x="280" y="520" width="62" height="24" rx="7" fill="#D6BB85"/>
      <rect x="286" y="496" width="50" height="24" rx="7" fill="#E3D2AE"/>
      <rect x="290" y="503" width="42" height="5" rx="2.5" fill="#8A6B3A" opacity=".6"/>
    </g>
    <!-- glass jars with herbs -->
    <g>
      <rect x="378" y="482" width="72" height="114" rx="10" fill="url(#rs-glass)" stroke="#BECDBB" stroke-width="2"/>
      <rect x="386" y="524" width="56" height="64" rx="6" fill="#B7C9A3" opacity=".9"/>
      <g fill="#7E9A82">
        <ellipse cx="402" cy="546" rx="14" ry="6" transform="rotate(-28 402 546)"/>
        <ellipse cx="426" cy="558" rx="14" ry="6" transform="rotate(24 426 558)"/>
        <ellipse cx="408" cy="572" rx="12" ry="5" transform="rotate(-8 408 572)"/>
      </g>
      <rect x="384" y="464" width="60" height="22" rx="5" fill="#B98A5D"/>
    </g>
    <g>
      <rect x="470" y="518" width="54" height="78" rx="8" fill="#E7EDE1" stroke="#C8D6C5" stroke-width="2"/>
      <rect x="478" y="546" width="38" height="42" rx="4" fill="#C4D2AE"/>
      <rect x="482" y="500" width="30" height="20" rx="4" fill="#3E2C1A"/>
    </g>
    <!-- mortar on shelf -->
    <g>
      <path d="M560 568c0 24 20 38 44 38s44-14 44-38Z" fill="#9A6738"/>
      <ellipse cx="604" cy="568" rx="44" ry="14" fill="#B07A45"/>
      <ellipse cx="604" cy="568" rx="34" ry="9" fill="#6B451F"/>
      <ellipse cx="628" cy="556" rx="6" ry="3" fill="#8FA98F"/>
    </g>
  </g>

  <!-- counter foreground -->
  <rect y="812" width="800" height="188" fill="url(#rs-wood)"/>
  <rect y="812" width="800" height="9" fill="#D3A16A"/>
  <rect y="821" width="800" height="10" fill="#7A4E28" opacity=".35"/>
  <ellipse cx="400" cy="852" rx="270" ry="22" fill="url(#rs-shadow)"/>

  <!-- foreground still life -->
  <g>
    <!-- mortar -->
    <path d="M292 856c0 42 30 62 70 62s70-20 70-62Z" fill="#9A6738"/>
    <ellipse cx="362" cy="856" rx="70" ry="22" fill="#B07A45"/>
    <ellipse cx="362" cy="856" rx="56" ry="15" fill="#6B451F"/>
    <g transform="rotate(-24 432 800)">
      <rect x="420" y="742" width="22" height="112" rx="11" fill="#B98450"/>
      <ellipse cx="431" cy="858" rx="19" ry="22" fill="#9A6738"/>
    </g>
    <g fill="#7E9A82">
      <ellipse cx="340" cy="840" rx="18" ry="8" transform="rotate(-26 340 840)"/>
      <ellipse cx="386" cy="834" rx="16" ry="7" transform="rotate(18 386 834)"/>
    </g>
    <!-- bottles on counter -->
    <g>
      <rect x="514" y="742" width="54" height="110" rx="10" fill="url(#rs-amber)"/>
      <rect x="526" y="720" width="30" height="24" rx="5" fill="#3E2C1A"/>
      <rect x="520" y="774" width="42" height="46" rx="3" fill="#F7F0DE" opacity=".92"/>
      <rect x="526" y="786" width="28" height="3" fill="#6F8F72"/>
      <rect x="526" y="795" width="20" height="2.5" fill="#C9BFA9"/>
      <rect x="526" y="803" width="24" height="2.5" fill="#C9BFA9"/>
    </g>
    <g>
      <rect x="590" y="776" width="46" height="76" rx="9" fill="#DDE8DA"/>
      <rect x="600" y="758" width="26" height="20" rx="4" fill="#3E2C1A"/>
      <rect x="596" y="802" width="34" height="30" rx="2" fill="#F9F4E8"/>
      <rect x="602" y="812" width="22" height="2.5" fill="#7E9A82"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="238" cy="874" rx="34" ry="14" transform="rotate(-16 238 874)"/>
      <ellipse cx="660" cy="878" rx="30" ry="12" transform="rotate(22 660 878)"/>
      <ellipse cx="700" cy="858" rx="22" ry="9" transform="rotate(-8 700 858)"/>
    </g>
  </g>

  <!-- top label plate -->
  <g opacity=".8">
    <rect x="322" y="176" width="156" height="40" rx="20" fill="#F9F4E8" opacity=".7"/>
    <text x="400" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3D6C55" letter-spacing="3">MATERIA MEDICA</text>
  </g>
</svg>
