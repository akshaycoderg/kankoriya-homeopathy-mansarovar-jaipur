<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration of a welcoming clinic entrance with a deep green door, brass handle, potted plants and a stone step">
  <defs>
    <linearGradient id="ce-wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2EAD8"/>
      <stop offset="1" stop-color="#E9DEC8"/>
    </linearGradient>
    <linearGradient id="ce-door" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2C5A44"/>
      <stop offset="1" stop-color="#17382A"/>
    </linearGradient>
    <linearGradient id="ce-floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DFCFAF"/>
      <stop offset="1" stop-color="#CEB992"/>
    </linearGradient>
    <linearGradient id="ce-brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E3D2AE"/>
      <stop offset="1" stop-color="#B08B4E"/>
    </linearGradient>
    <radialGradient id="ce-light" cx=".5" cy=".1" r=".8">
      <stop stop-color="#FFF8E8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFF8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ce-shadow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#4E4028" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4E4028" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#ce-wall)"/>
  <rect width="800" height="1000" fill="url(#ce-light)"/>
  <rect y="806" width="800" height="194" fill="url(#ce-floor)"/>
  <rect y="802" width="800" height="6" fill="#F4EBDA"/>

  <!-- wall panels -->
  <g stroke="#E0D3BA" stroke-width="2" fill="none">
    <rect x="44" y="220" width="150" height="520" rx="6"/>
    <rect x="606" y="220" width="150" height="520" rx="6"/>
  </g>

  <!-- doorway frame -->
  <rect x="238" y="150" width="324" height="656" rx="8" fill="#F7F0DF"/>
  <rect x="252" y="164" width="296" height="642" rx="5" fill="#D8C7A6"/>
  <rect x="266" y="178" width="268" height="628" rx="4" fill="url(#ce-door)"/>

  <!-- door details -->
  <g>
    <rect x="292" y="212" width="216" height="230" rx="4" fill="none" stroke="#3D6C55" stroke-width="2"/>
    <rect x="292" y="476" width="216" height="286" rx="4" fill="none" stroke="#3D6C55" stroke-width="2"/>
    <rect x="292" y="212" width="216" height="230" rx="4" fill="#1E4735" opacity=".35"/>
    <rect x="292" y="476" width="216" height="286" rx="4" fill="#1E4735" opacity=".35"/>
    <!-- glass panel top with reflection -->
    <path d="M300 220h200v98l-200 40Z" fill="#7E9A82" opacity=".25"/>
    <path d="M300 230h80l-80 16Z" fill="#EAF1E5" opacity=".25"/>
    <!-- brass handle -->
    <rect x="492" y="472" width="14" height="64" rx="7" fill="url(#ce-brass)"/>
    <circle cx="499" cy="490" r="11" fill="url(#ce-brass)"/>
    <rect x="480" y="500" width="38" height="9" rx="4.5" fill="url(#ce-brass)"/>
    <!-- kick plate -->
    <rect x="278" y="762" width="244" height="32" rx="3" fill="url(#ce-brass)" opacity=".8"/>
  </g>

  <!-- sign above door -->
  <g>
    <rect x="256" y="98" width="288" height="46" rx="8" fill="#17382A"/>
    <rect x="260" y="102" width="280" height="38" rx="6" fill="none" stroke="#C2A265" stroke-width="1.4"/>
    <text x="400" y="127" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#F7F2E6" letter-spacing="2.2">Kankoriya Homeopathy</text>
  </g>

  <!-- wall lamp -->
  <g transform="translate(176 300)">
    <path d="M0 0v44" stroke="#B08B4E" stroke-width="4"/>
    <path d="M-26 44h52l-10 42h-32Z" fill="#F4E9CE" stroke="#C2A265" stroke-width="2"/>
    <ellipse cx="0" cy="86" rx="30" ry="8" fill="#FFF6D9" opacity=".65"/>
    <circle cx="0" cy="92" r="20" fill="#FFF6D9" opacity=".35"/>
  </g>

  <!-- large potted plant left -->
  <g>
    <ellipse cx="140" cy="822" rx="94" ry="18" fill="url(#ce-shadow)"/>
    <path d="M80 686h120l18 126H62Z" fill="#B98A5D"/>
    <path d="M80 686h120l-6-16H86Z" fill="#D2A574"/>
    <path d="M74 742h132" stroke="#9A6E42" stroke-width="3" opacity=".5"/>
    <g stroke="#4F7157" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M140 686c-6-110-12-192-42-266"/>
      <path d="M140 650c18-84 42-146 84-190"/>
      <path d="M138 592c-32-54-58-90-96-114"/>
      <path d="M142 560c8-72 4-124-6-170"/>
    </g>
    <g fill="#7E9A82">
      <ellipse cx="92" cy="420" rx="52" ry="22" transform="rotate(-38 92 420)"/>
      <ellipse cx="228" cy="458" rx="48" ry="20" transform="rotate(26 228 458)"/>
      <ellipse cx="42" cy="474" rx="42" ry="18" transform="rotate(18 42 474)"/>
      <ellipse cx="146" cy="346" rx="40" ry="17" transform="rotate(-8 146 346)"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="120" cy="520" rx="36" ry="15" transform="rotate(-24 120 520)"/>
      <ellipse cx="192" cy="536" rx="34" ry="14" transform="rotate(30 192 536)"/>
      <ellipse cx="164" cy="398" rx="30" ry="13" transform="rotate(12 164 398)"/>
    </g>
  </g>

  <!-- smaller plant right -->
  <g>
    <ellipse cx="662" cy="834" rx="70" ry="14" fill="url(#ce-shadow)"/>
    <path d="M622 730h80l12 92h-104Z" fill="#C9D8C4"/>
    <path d="M622 730h80l-4-12h-72Z" fill="#DCE8D7"/>
    <g stroke="#5F7F63" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M662 730c-2-62-6-108-22-148"/>
      <path d="M662 704c12-46 26-78 48-100"/>
      <path d="M660 676c-18-26-32-42-54-52"/>
    </g>
    <g fill="#8FA98F">
      <ellipse cx="632" cy="586" rx="30" ry="13" transform="rotate(-34 632 586)"/>
      <ellipse cx="708" cy="606" rx="28" ry="12" transform="rotate(30 708 606)"/>
      <ellipse cx="602" cy="640" rx="24" ry="10" transform="rotate(18 602 640)"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="656" cy="540" rx="24" ry="10" transform="rotate(-18 656 540)"/>
    </g>
  </g>

  <!-- step mats -->
  <ellipse cx="400" cy="840" rx="220" ry="30" fill="url(#ce-shadow)"/>
  <rect x="288" y="806" width="224" height="32" rx="6" fill="#D8C7A6"/>
  <rect x="288" y="806" width="224" height="8" fill="#EADCC2"/>
  <rect x="270" y="838" width="260" height="26" rx="8" fill="#CDB992"/>

  <!-- mat -->
  <g transform="translate(330 884)">
    <rect width="140" height="74" rx="8" fill="#3D6C55" opacity=".85"/>
    <rect x="8" y="8" width="124" height="58" rx="5" fill="none" stroke="#C2A265" stroke-width="2" opacity=".8"/>
    <text x="70" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F7F2E6" letter-spacing="2">WELCOME</text>
  </g>

  <!-- decorative leaves on floor -->
  <g fill="#8FA98F" opacity=".8">
    <ellipse cx="560" cy="930" rx="28" ry="11" transform="rotate(-26 560 930)"/>
    <ellipse cx="220" cy="948" rx="24" ry="10" transform="rotate(20 220 948)"/>
  </g>
</svg>
