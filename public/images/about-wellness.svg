<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Botanical still life with a wooden mortar and pestle, homeopathic remedy bottles and fresh herbs">
  <defs>
    <linearGradient id="aw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3EBD9"/>
      <stop offset="0.55" stop-color="#EFE6D3"/>
      <stop offset="1" stop-color="#E8E5D2"/>
    </linearGradient>
    <radialGradient id="aw-sun" cx="0.72" cy="0.18" r="0.7">
      <stop stop-color="#FFFDF4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFDF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-arch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E4ECDF"/>
      <stop offset="1" stop-color="#D5E1D2"/>
    </linearGradient>
    <linearGradient id="aw-table" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E4D8C0"/>
      <stop offset="1" stop-color="#DCCDB1"/>
    </linearGradient>
    <linearGradient id="aw-wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A9743F"/>
      <stop offset="0.5" stop-color="#8C5B2F"/>
      <stop offset="1" stop-color="#6E4523"/>
    </linearGradient>
    <linearGradient id="aw-wood-light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#B98450"/>
      <stop offset="1" stop-color="#8A5A30"/>
    </linearGradient>
    <linearGradient id="aw-amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C58A3E"/>
      <stop offset="1" stop-color="#8E5E22"/>
    </linearGradient>
    <linearGradient id="aw-glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#DDE6DC" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="aw-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#5B4A2C" stop-opacity=".32"/>
      <stop offset="1" stop-color="#5B4A2C" stop-opacity="0"/>
    </radialGradient>
    <filter id="aw-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="aw-blur-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#aw-bg)"/>
  <rect width="900" height="1125" fill="url(#aw-sun)"/>

  <!-- structural arch -->
  <path d="M158 760V352c0-152 130-252 292-252s292 100 292 252v408Z" fill="url(#aw-arch)"/>
  <path d="M158 760V352c0-152 130-252 292-252s292 100 292 252v408Z" fill="none" stroke="#C9D8C7" stroke-width="2"/>
  <path d="M188 760V356c0-136 118-226 262-226s262 90 262 226v404Z" fill="#EAF0E4" opacity=".55"/>

  <!-- soft light shafts -->
  <path d="M618 128 500 760h150l96-632Z" fill="#FFFDF3" opacity=".35"/>
  <path d="M680 160 594 760h56l84-600Z" fill="#FFFDF3" opacity=".3"/>

  <!-- table -->
  <rect x="0" y="812" width="900" height="313" fill="url(#aw-table)"/>
  <rect x="0" y="812" width="900" height="5" fill="#F3EAD8"/>
  <ellipse cx="450" cy="836" rx="420" ry="34" fill="#F7F0DF" opacity=".6"/>

  <!-- shadows -->
  <ellipse cx="470" cy="852" rx="245" ry="38" fill="url(#aw-shadow)"/>
  <ellipse cx="250" cy="838" rx="105" ry="20" fill="url(#aw-shadow)"/>
  <ellipse cx="688" cy="846" rx="96" ry="18" fill="url(#aw-shadow)"/>

  <!-- hanging eucalyptus top left -->
  <g stroke="#6F8F72" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M118 0c36 92 70 184 92 292"/>
    <path d="M150 96c-30 14-49 34-58 62"/>
    <path d="M172 168c-34 10-57 28-70 56"/>
    <path d="M190 240c-34 8-58 25-74 52"/>
    <path d="M168 122c30-4 52 6 66 28"/>
    <path d="M190 196c32 0 55 12 69 36"/>
  </g>
  <g fill="#8FA98F">
    <ellipse cx="88" cy="156" rx="26" ry="13" transform="rotate(32 88 156)"/>
    <ellipse cx="104" cy="222" rx="25" ry="12" transform="rotate(26 104 222)"/>
    <ellipse cx="118" cy="290" rx="24" ry="12" transform="rotate(20 118 290)"/>
    <ellipse cx="238" cy="144" rx="24" ry="12" transform="rotate(-30 238 144)"/>
    <ellipse cx="262" cy="228" rx="24" ry="12" transform="rotate(-22 262 228)"/>
    <ellipse cx="96" cy="104" rx="22" ry="11" transform="rotate(40 96 104)"/>
  </g>
  <g fill="#A9BEA6">
    <ellipse cx="126" cy="192" rx="20" ry="10" transform="rotate(22 126 192)"/>
    <ellipse cx="228" cy="188" rx="19" ry="10" transform="rotate(-26 228 188)"/>
  </g>

  <!-- tall dried stems right -->
  <g stroke="#9B8A5F" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M772 812c-6-172-2-314 32-436"/>
    <path d="M792 660c22-30 30-60 28-96"/>
    <path d="M780 724c-26-18-40-42-44-74"/>
    <path d="M786 566c24-19 36-43 38-74"/>
  </g>
  <g fill="#B9A87A">
    <ellipse cx="822" cy="548" rx="22" ry="9" transform="rotate(-38 822 548)"/>
    <ellipse cx="826" cy="620" rx="20" ry="8" transform="rotate(-32 826 620)"/>
    <ellipse cx="740" cy="642" rx="22" ry="8" transform="rotate(28 740 642)"/>
    <ellipse cx="746" cy="704" rx="18" ry="7" transform="rotate(24 746 704)"/>
    <ellipse cx="812" cy="474" rx="18" ry="7" transform="rotate(-42 812 474)"/>
  </g>

  <!-- amber dropper bottle -->
  <g>
    <rect x="192" y="650" width="118" height="172" rx="22" fill="url(#aw-amber)"/>
    <rect x="204" y="662" width="94" height="148" rx="16" fill="#E7BE80" opacity=".35"/>
    <rect x="206" y="606" width="90" height="48" rx="12" fill="#3E2C1A"/>
    <rect x="238" y="576" width="26" height="38" rx="6" fill="#241A10"/>
    <rect x="224" y="588" width="54" height="12" rx="4" fill="#5B422A"/>
    <rect x="214" y="700" width="74" height="54" rx="6" fill="#F5EEDD" opacity=".92"/>
    <rect x="224" y="714" width="54" height="4" rx="2" fill="#6F8F72"/>
    <rect x="224" y="724" width="40" height="3" rx="1.5" fill="#A9BEA6"/>
    <rect x="224" y="732" width="48" height="3" rx="1.5" fill="#A9BEA6"/>
    <rect x="208" y="668" width="12" height="118" rx="6" fill="#FFF8E6" opacity=".28"/>
  </g>

  <!-- clear jar with herbal tincture -->
  <g>
    <rect x="636" y="672" width="108" height="146" rx="18" fill="url(#aw-glass)" stroke="#C9D5C7" stroke-width="2"/>
    <rect x="644" y="748" width="92" height="62" rx="12" fill="#A7B98D" opacity=".75"/>
    <rect x="644" y="736" width="92" height="14" fill="#C4D2AE" opacity=".6"/>
    <g fill="#7E9A82" opacity=".85">
      <ellipse cx="672" cy="766" rx="12" ry="6" transform="rotate(-24 672 766)"/>
      <ellipse cx="706" cy="778" rx="13" ry="6" transform="rotate(18 706 778)"/>
      <ellipse cx="686" cy="790" rx="11" ry="5" transform="rotate(-12 686 790)"/>
    </g>
    <rect x="642" y="622" width="96" height="54" rx="12" fill="#3E2C1A"/>
    <rect x="654" y="634" width="72" height="30" rx="6" fill="#F2E9D4" opacity=".9"/>
    <rect x="664" y="644" width="52" height="3" rx="1.5" fill="#6F8F72"/>
    <rect x="664" y="652" width="38" height="3" rx="1.5" fill="#A9BEA6"/>
    <rect x="650" y="692" width="9" height="104" rx="4.5" fill="#FFFFFF" opacity=".55"/>
  </g>

  <!-- wooden mortar and pestle -->
  <g>
    <path d="M352 742c0 72 40 108 103 108s103-36 103-108Z" fill="url(#aw-wood)"/>
    <ellipse cx="455" cy="742" rx="103" ry="36" fill="url(#aw-wood-light)"/>
    <ellipse cx="455" cy="742" rx="86" ry="27" fill="#4E3118"/>
    <ellipse cx="455" cy="745" rx="74" ry="20" fill="#6B451F"/>
    <path d="M389 776c22 14 44 20 66 20s44-6 66-20" stroke="#5F3B1B" stroke-width="3" fill="none" opacity=".5"/>
    <path d="M388 792c24 15 44 21 67 21s43-6 67-21" stroke="#5F3B1B" stroke-width="2" fill="none" opacity=".35"/>
    <!-- pestle -->
    <g transform="rotate(-28 560 640)">
      <rect x="540" y="500" width="34" height="222" rx="17" fill="url(#aw-wood-light)"/>
      <ellipse cx="557" cy="700" rx="30" ry="34" fill="#9A6738"/>
      <ellipse cx="557" cy="706" rx="24" ry="26" fill="#B07A45"/>
      <rect x="548" y="520" width="7" height="150" rx="3.5" fill="#E4BE8C" opacity=".35"/>
    </g>
    <!-- herbs in mortar -->
    <g fill="#6F8F72">
      <ellipse cx="430" cy="724" rx="26" ry="11" transform="rotate(-24 430 724)"/>
      <ellipse cx="472" cy="716" rx="22" ry="10" transform="rotate(16 472 716)"/>
      <ellipse cx="500" cy="728" rx="20" ry="9" transform="rotate(-8 500 728)"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="452" cy="708" rx="18" ry="8" transform="rotate(-34 452 708)"/>
      <ellipse cx="488" cy="710" rx="16" ry="7" transform="rotate(32 488 710)"/>
    </g>
  </g>

  <!-- fallen leaves foreground -->
  <g fill="#7E9A82">
    <ellipse cx="292" cy="884" rx="34" ry="14" transform="rotate(-18 292 884)"/>
    <ellipse cx="342" cy="902" rx="24" ry="10" transform="rotate(14 342 902)"/>
    <ellipse cx="604" cy="878" rx="30" ry="12" transform="rotate(22 604 878)"/>
    <ellipse cx="650" cy="898" rx="20" ry="9" transform="rotate(-10 650 898)"/>
  </g>
  <g fill="#B9A87A">
    <ellipse cx="560" cy="916" rx="28" ry="11" transform="rotate(-26 560 916)"/>
    <ellipse cx="380" cy="936" rx="22" ry="9" transform="rotate(30 380 936)"/>
  </g>

  <!-- small label card -->
  <g transform="rotate(-4 120 950)">
    <rect x="64" y="906" width="150" height="82" rx="8" fill="#F8F2E2" opacity=".96"/>
    <rect x="76" y="920" width="60" height="4" rx="2" fill="#C2A265"/>
    <rect x="76" y="932" width="120" height="3" rx="1.5" fill="#B7AE99"/>
    <rect x="76" y="942" width="104" height="3" rx="1.5" fill="#B7AE99"/>
    <rect x="76" y="952" width="112" height="3" rx="1.5" fill="#B7AE99"/>
  </g>

  <!-- vignette -->
  <rect width="900" height="1125" fill="none"/>
  <rect x="1" y="1" width="898" height="1123" rx="0" fill="none" stroke="#D9CDB4" stroke-width="2" opacity=".55"/>
</svg>
