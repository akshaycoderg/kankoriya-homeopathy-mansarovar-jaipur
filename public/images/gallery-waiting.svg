<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration of a warm, plant-filled clinic waiting lounge with a sofa, cushions and a pendant lamp">
  <defs>
    <linearGradient id="wl-wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F3EBD9"/>
      <stop offset="1" stop-color="#EAE0CB"/>
    </linearGradient>
    <linearGradient id="wl-floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DFCFAF"/>
      <stop offset="1" stop-color="#D2BE97"/>
    </linearGradient>
    <linearGradient id="wl-sofa" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C9D8C4"/>
      <stop offset="1" stop-color="#AEC4AA"/>
    </linearGradient>
    <linearGradient id="wl-niche" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DCE8D7"/>
      <stop offset="1" stop-color="#C7D8C3"/>
    </linearGradient>
    <radialGradient id="wl-shadow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#5B4A2C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5B4A2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wl-glow" cx=".5" cy=".2" r=".7">
      <stop stop-color="#FFF6D9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFF6D9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wl-wall)"/>
  <rect y="754" width="800" height="246" fill="url(#wl-floor)"/>
  <rect y="750" width="800" height="6" fill="#F4EBDA"/>

  <!-- wall moulding -->
  <rect x="0" y="628" width="800" height="14" fill="#E3D6BE"/>
  <rect x="0" y="642" width="800" height="4" fill="#D6C6A8"/>

  <!-- arch niche with plant -->
  <path d="M506 620V376c0-84 62-140 138-140s138 56 138 140v244Z" fill="url(#wl-niche)"/>
  <path d="M522 620V380c0-74 56-124 122-124s122 50 122 124v240Z" fill="#E9F0E4" opacity=".5"/>
  <g>
    <ellipse cx="644" cy="620" rx="48" ry="10" fill="#9DAF99" opacity=".5"/>
    <path d="M614 540h60l10 80h-80Z" fill="#B98A5D"/>
    <g stroke="#5F7F63" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M644 540c-4-60-8-100-24-136"/>
      <path d="M644 520c14-38 28-64 48-84"/>
      <path d="M640 492c-22-28-38-44-62-54"/>
    </g>
    <g fill="#7E9A82">
      <ellipse cx="618" cy="420" rx="32" ry="14" transform="rotate(-34 618 420)"/>
      <ellipse cx="678" cy="450" rx="30" ry="13" transform="rotate(30 678 450)"/>
      <ellipse cx="590" cy="462" rx="24" ry="11" transform="rotate(20 590 462)"/>
    </g>
    <g fill="#A9BEA6">
      <ellipse cx="654" cy="392" rx="24" ry="10" transform="rotate(-16 654 392)"/>
      <ellipse cx="632" cy="474" rx="20" ry="9" transform="rotate(34 632 474)"/>
    </g>
  </g>

  <!-- framed art left -->
  <g transform="translate(100 250)">
    <rect width="168" height="212" rx="5" fill="#F9F4E8" stroke="#C9BCA1" stroke-width="3"/>
    <rect x="12" y="12" width="144" height="188" fill="#E4ECDF"/>
    <path d="M84 168V76" stroke="#7E9A82" stroke-width="2"/>
    <path d="M84 130c-26 0-40-13-41-39 27-1 40 14 41 39Z" fill="#8FA98F"/>
    <path d="M84 106c2-26 15-39 41-38-1 26-15 39-41 38Z" fill="#A9BEA6"/>
    <circle cx="118" cy="62" r="12" fill="#C2A265" opacity=".7"/>
  </g>

  <!-- pendant lamp -->
  <g>
    <path d="M300 0v150" stroke="#8A6B3A" stroke-width="3"/>
    <circle cx="300" cy="150" r="34" fill="url(#wl-glow)"/>
    <path d="M256 194c0-24 18-44 44-44s44 20 44 44Z" fill="#C2A265"/>
    <path d="M252 194h96" stroke="#8A6B3A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="198" r="7" fill="#F6E7B8"/>
    <circle cx="300" cy="198" r="22" fill="#FFF6D9" opacity=".35"/>
  </g>

  <!-- sofa -->
  <g>
    <ellipse cx="330" cy="846" rx="250" ry="34" fill="url(#wl-shadow)"/>
    <rect x="120" y="628" width="420" height="118" rx="34" fill="url(#wl-sofa)"/>
    <rect x="120" y="718" width="420" height="94" rx="26" fill="#B7CBAF"/>
    <rect x="144" y="678" width="172" height="70" rx="20" fill="#E7EEE2"/>
    <rect x="336" y="678" width="178" height="70" rx="20" fill="#E7EEE2"/>
    <rect x="120" y="700" width="420" height="28" rx="14" fill="#C7D8C1" opacity=".7"/>
    <rect x="136" y="800" width="18" height="44" rx="7" fill="#8C6A3E"/>
    <rect x="506" y="800" width="18" height="44" rx="7" fill="#8C6A3E"/>
    <rect x="112" y="612" width="436" height="40" rx="20" fill="#B7CBAF"/>
    <!-- cushions -->
    <g transform="rotate(-8 210 690)">
      <rect x="168" y="636" width="84" height="88" rx="16" fill="#E9DFC9"/>
      <rect x="178" y="650" width="64" height="60" rx="10" fill="none" stroke="#D3C3A4" stroke-width="2"/>
    </g>
    <g transform="rotate(7 400 690)">
      <rect x="356" y="636" width="80" height="84" rx="16" fill="#D9B98A"/>
      <rect x="366" y="650" width="60" height="56" rx="10" fill="none" stroke="#C4A274" stroke-width="2"/>
    </g>
    <g transform="rotate(4 470 700)">
      <rect x="434" y="652" width="66" height="70" rx="14" fill="#E9EFE4"/>
    </g>
  </g>

  <!-- side table + books + cup -->
  <g transform="translate(596 640)">
    <ellipse cx="60" cy="192" rx="96" ry="18" fill="url(#wl-shadow)"/>
    <rect x="0" y="0" width="122" height="12" rx="5" fill="#A9743F"/>
    <rect x="8" y="12" width="106" height="8" fill="#7C5028" opacity=".5"/>
    <rect x="10" y="12" width="10" height="160" rx="5" fill="#8C5B2F"/>
    <rect x="102" y="12" width="10" height="160" rx="5" fill="#8C5B2F"/>
    <rect x="12" y="172" width="98" height="8" rx="4" fill="#A9743F"/>
    <g transform="translate(18 -32)">
      <rect x="0" y="20" width="86" height="12" rx="3" fill="#C2A265"/>
      <rect x="6" y="8" width="74" height="12" rx="3" fill="#E7EDE1"/>
      <rect x="12" y="-4" width="60" height="12" rx="3" fill="#8FA98F"/>
    </g>
    <g transform="translate(32 -62)">
      <ellipse cx="24" cy="24" rx="20" ry="8" fill="#EFE6D3"/>
      <path d="M4 8h40v12c0 8-8 12-20 12s-20-4-20-12Z" fill="#FBF6E8" stroke="#D3C6AC" stroke-width="2"/>
      <path d="M44 12h8c6 0 8 10 0 10h-8" fill="none" stroke="#D3C6AC" stroke-width="2"/>
    </g>
  </g>

  <!-- rug -->
  <ellipse cx="330" cy="900" rx="290" ry="56" fill="#EDE2CB" opacity=".9"/>
  <ellipse cx="330" cy="900" rx="250" ry="44" fill="none" stroke="#DCCDAE" stroke-width="3"/>
  <ellipse cx="330" cy="900" rx="200" ry="32" fill="none" stroke="#DCCDAE" stroke-width="1.5"/>

  <!-- small plant left -->
  <g transform="translate(84 648)">
    <ellipse cx="34" cy="128" rx="44" ry="10" fill="url(#wl-shadow)"/>
    <path d="M6 70h56l8 56H-2Z" fill="#B98A5D"/>
    <g stroke="#5F7F63" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M34 70c0-28-4-48-14-66"/>
      <path d="M34 58c10-22 22-38 36-48"/>
    </g>
    <g fill="#7E9A82">
      <ellipse cx="14" cy="26" rx="20" ry="9" transform="rotate(-34 14 26)"/>
      <ellipse cx="66" cy="28" rx="20" ry="9" transform="rotate(32 66 28)"/>
    </g>
  </g>
</svg>
